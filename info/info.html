<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informações Cadastrais</title>
    <link rel="stylesheet" href="info_cadastro.css">
    <link rel="shortcut icon" href="/imagens/cursos/logo.png" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        h2 {
            text-align: center;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #editar-btn {
            background-color: #007bff;
            color: white;
        }
        #salvar-btn {
            background-color: #28a745;
            color: white;
        }
        #redefinir-senha-btn {
            background-color: #dc3545;
            color: white;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Informações Cadastrais</h2>
        <form id="cadastro-form">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" value="Fulano da Silva" disabled>
            
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" value="fulano@email.com" disabled>
            
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" value="123.456.789-00" disabled>
            
            <label for="curso">Curso:</label>
            <input type="text" id="curso" name="curso" value="Python" disabled>
            
            <button type="button" id="editar-btn">Editar</button>
            <button type="submit" id="salvar-btn" disabled>Salvar</button>
            <button type="button" id="redefinir-senha-btn" onclick="window.location.href='redefinir_senha.html'">Redefinir Senha</button>
        </form>
    </div>
    <script>
        document.getElementById("editar-btn").addEventListener("click", function() {
            let inputs = document.querySelectorAll("input:not(#senha, #senha-atual)");
            inputs.forEach(input => input.disabled = !input.disabled);
            document.getElementById("salvar-btn").disabled = !document.getElementById("salvar-btn").disabled;
        });
    </script>
</body>
</html>
