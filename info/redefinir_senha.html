<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha</title>
    <link rel="stylesheet" href="redefinir_senha.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        h2 {
            text-align: center;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Redefinir Senha</h2>
        <form id="redefinir-senha-form">
            <label for="senha-atual">Senha Atual:</label>
            <input type="password" id="senha-atual" name="senha-atual" placeholder="Digite sua senha atual" required>
            
            <label for="nova-senha">Nova Senha:</label>
            <input type="password" id="nova-senha" name="nova-senha" placeholder="Digite a nova senha" required>
            
            <label for="confirmar-senha">Confirmar Nova Senha:</label>
            <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Confirme a nova senha" required>
            
            <button type="submit">Alterar Senha</button>
        </form>
    </div>
    <script>
        document.getElementById("redefinir-senha-form").addEventListener("submit", function(event) {
            event.preventDefault();
            let senhaAtual = document.getElementById("senha-atual").value;
            let novaSenha = document.getElementById("nova-senha").value;
            let confirmarSenha = document.getElementById("confirmar-senha").value;
            
            if (novaSenha !== confirmarSenha) {
                alert("As senhas não coincidem!");
                return;
            }
            
            alert("Senha alterada com sucesso!");
        });
    </script>
</body>
</html>
