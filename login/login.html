<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - FGS Cursos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
  <link rel="shortcut icon" href="/imagens/cursos/logo.png" type="image/x-icon">
</head>
<body>
  <div class="page-wrapper">
    <div class="illustration-side">
      <div class="logo">
        <h1>FGS <span class="cursos-texto">Cursos</span></h1>
        <p>Uma plataforma completa para<br>transformar sua carreira com<br>educação de qualidade.</p>
        <img src="/imagens/cursos/ilustraçãoat.png" alt="Ilustração estudante">
      </div>
    </div>

    <div class="login-card">
      <form class="login-form" action="processar_login.php" method="POST">
        <h2>Login</h2>
        <p class="sub">Acesse sua conta:</p>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

        <div class="forgot">
          <a href="#">Esqueceu a senha?</a>
        </div>

        <button type="submit">Acessar</button>

        <p class="signup">Não tem conta? <a href="/cadastro/cadastro.html">Cadastre-se</a></p>
      </form>
    </div>
  </div>
</body>
</html>
