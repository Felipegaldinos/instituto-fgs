<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="inicio.css">
    <link rel="shortcut icon" href="/imagens/cursos/logo.png" type="image/x-icon">
    <title>FGS-Cursos</title>
</head>
<body>
    <header class="topbar">

        <!-- Bloco esquerdo vazio para balancear -->
        <div class="topbar-left"></div>
      
        <!-- Logo centralizada -->
        <div class="logo-center">
          <img src="/imagens/cursos/logo.png" alt="Logo FGS" class="logo-img">
        </div>
      
        <!-- Ícones com links à direita -->
        <div class="topbar-right">
          <a href="notificacoes.html" class="icon" title="Notificações">🔔</a>
          <a href="/info/info.html" class="icon" title="Perfil">👤</a>
        </div>
      </header>
      
      
      
    <!-- Menu de Navegação -->
    <nav class="navbar">
        <a href="#" class="logo"></a>
        <span class="menu-toggle" onclick="toggleMenu()">☰</span>
        <ul class="menu">
            <li><a href="Dicas/dicas.html">Dicas</a></li>
            <li><a href="menu/sobre.html">Sobre</a></li>
    </nav>
    <!-- Botão para abrir o chat  -->

    <button id="chat-btn" onclick="window.open('chat/chat.html', '_blank')">💬 Chat</button>


    <!-- Botão de Alternar Tema -->
    <button id="theme-toggle">🌙</button>

    <div class="header">
    </div>

    <div class="search-bar">
        <input type="text" id="search" placeholder="Busque um curso..." onkeyup="filterCourses()">
    </div>

    <div class="container" id="course-list"></div>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-section">
                <h3>Contato</h3>
                <p>Email: <a href="mailto:suporte@instituto.com">suporte@instituto.com</a></p>
            </div>
            <div class="footer-section">
                <h3>Redes Sociais</h3>
                <a href="#" class="social-icon"><img src="facebook-icon.png" alt="Facebook"></a>
                <a href="#" class="social-icon"><img src="instagram-icon.png" alt="Instagram"></a>
                <a href="#" class="social-icon"><img src="linkedin-icon.png" alt="LinkedIn"></a>
            </div>
            <div class="footer-section">
                <p>&copy; 2024 Instituto Cursos. Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>

</html>
